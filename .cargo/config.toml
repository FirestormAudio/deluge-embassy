[build]
target = "armv7a-none-eabihf"

# ---------------------------------------------------------------------------
# armv7-unknown-linux-gnueabihf — used for QEMU benchmark runs only.
# Run: cargo bench --target armv7-unknown-linux-gnueabihf
#
# qemu-arm -cpu cortex-a9 emulates Cortex-A9 including VFPv3-D16 and NEON.
# The RUSTFLAGS here match the embedded target so codegen is representative.
# ---------------------------------------------------------------------------
[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
runner = ["qemu-arm", "-cpu", "cortex-a9", "-L", "/usr/arm-linux-gnueabihf"]
rustflags = [
  "-C", "target-cpu=cortex-a9",
  "-C", "target-feature=+neon",
]

[target.armv7a-none-eabihf]
rustflags = [
  "-C", "target-cpu=cortex-a9",
  "-C", "target-feature=+neon",
  "-C", "link-arg=--gc-sections",
  "-C", "force-frame-pointers=yes",
]

[alias]
# Used when building the embedded firmware for armv7a-none-eabihf.
# build-std cannot live in [unstable] because it applies to all targets,
# breaking host-native `cargo test` for the rza1/deluge-bsp crates.
# build-fw-bin requires cargo-binutils (`cargo install cargo-binutils`).
# `core,alloc` (not just `core`): matches `cargo deluge build` (see
# tools/cargo-deluge/src/build.rs) so `alloc` apps (e.g. the GPL
# deluge-ui-toolkit menu/text) don't hit E0152 under this alias but not that
# one. `alloc` is a no-op extra for apps that don't use it.
build-fw      = "build -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem"
# `core,alloc` here for the same reason as `build-fw` above: with `core` alone,
# `alloc`-using workspace members (deluge-grid-toolkit, deluge-ui-toolkit) pull
# `alloc` from the prebuilt sysroot while `core` is built from source, and the
# two `core`s collide with `E0152: duplicate lang item in crate 'core'`.
build-fw-rel  = "build -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem --release --no-default-features"
# Kept as a documented alias of `build-fw` (identical build-std set) now that
# `build-fw` itself includes `alloc` — old invocations/scripts keep working.
# Usage: cargo build-fw-alloc -p oled_menu
build-fw-alloc = "build -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem"
build-fw-bin  = "objcopy -Zbuild-std=core -Zbuild-std-features=compiler-builtins-mem --release --no-default-features -p demo-firmware -- -O binary target/armv7a-none-eabihf/release/demo-firmware.bin"
build-controller-bin = "objcopy -Zbuild-std=core -Zbuild-std-features=compiler-builtins-mem --release --no-default-features -p deluge-controller -- -O binary target/armv7a-none-eabihf/release/deluge-controller.bin"
build-msc            = "build -Zbuild-std=core -Zbuild-std-features=compiler-builtins-mem -p msc-firmware"
build-msc-bin        = "objcopy -Zbuild-std=core -Zbuild-std-features=compiler-builtins-mem --release --no-default-features -p msc-firmware -- -O binary target/armv7a-none-eabihf/release/msc-firmware.bin"
# --features rtt is explicit because uac-host-firmware can no longer default it
# on: a default-on `rtt` leaks through workspace feature unification into the
# shared rza1l-hal rlib and breaks the link of every other firmware (see the
# comment in firmwares/uac-host-firmware/Cargo.toml).  This alias keeps the
# usual RTT-enabled dev build; build-uac-bin stays --no-default-features.
build-uac            = "build -Zbuild-std=core -Zbuild-std-features=compiler-builtins-mem -p uac-host-firmware --features rtt"
build-uac-bin        = "objcopy -Zbuild-std=core -Zbuild-std-features=compiler-builtins-mem --release --no-default-features -p uac-host-firmware -- -O binary target/armv7a-none-eabihf/release/uac-host-firmware.bin"
build-app-loader     = "build -Zbuild-std=core -Zbuild-std-features=compiler-builtins-mem -p app-loader"
build-app-loader-bin = "objcopy -Zbuild-std=core -Zbuild-std-features=compiler-builtins-mem --release --no-default-features -p app-loader -- -O binary target/armv7a-none-eabihf/release/app-loader.bin"
# Host-side ELF -> Deluge-SSB UF2 converter (tools/elf2uf2). The explicit
# --target overrides the armv7a [build] target above so it builds for the host.
# Usage: cargo elf2uf2 path/to/firmware.elf [-o out.uf2] [--bin]
elf2uf2              = "run --manifest-path tools/elf2uf2/Cargo.toml --target x86_64-unknown-linux-gnu --release --"
# Host-side wren-core debug harness (tools/wren-web-debug). The explicit
# --target overrides the armv7a [build] target above so it builds for the host.
# Usage: cargo test-wren-debug
test-wren-debug       = "test --manifest-path tools/wren-web-debug/Cargo.toml --target x86_64-unknown-linux-gnu"
# Host-side static-wavetable generator (crates/mipgen, bin gen_tables). The
# explicit --target overrides the armv7a [build] target above so it builds for
# the host; --features gen-tables switches on the `required-features` gate that
# keeps this std-only bin out of the default ARM `cargo build`.
# Usage: cargo gen-tables > crates/deluge-dsp-kernels/src/wavetables_generated.rs
gen-tables           = "run -p mipgen --bin gen_tables --features gen-tables --target x86_64-unknown-linux-gnu --release"
build-wren           = "build -Zbuild-std=core -Zbuild-std-features=compiler-builtins-mem -p wren-firmware"
build-wren-bin       = "objcopy -Zbuild-std=core -Zbuild-std-features=compiler-builtins-mem --release --no-default-features -p wren-firmware -- -O binary target/armv7a-none-eabihf/release/wren-firmware.bin"

# ---------------------------------------------------------------------------
# armv7-unknown-linux-musleabihf — the Deluge's Linux userland (deluge-linux).
# `cargo deluge linux` selects this triple and prepends the bundle toolchain's
# bin to PATH so `arm-linux-gcc` resolves; apps are fully static (crt-static)
# because they run from the SD card and must not depend on any image's rootfs.
# ---------------------------------------------------------------------------
[target.armv7-unknown-linux-musleabihf]
linker = "arm-linux-gcc"
rustflags = [
  "-C", "target-cpu=cortex-a9",
  "-C", "target-feature=+neon,+crt-static",
]

[env]
# UAC2 (3 ifaces) + CDC-ACM (2 ifaces) + USB-MIDI (2 ifaces) = 7 total.
EMBASSY_USB_MAX_INTERFACE_COUNT = "8"
