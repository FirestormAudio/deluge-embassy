[package]
name = "deluge-bsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Board support package for the Synthstrom Deluge (peripherals, PIC, OLED, SD)."
categories = ["embedded", "no-std", "hardware-support"]
keywords = ["deluge", "synthstrom", "bsp", "rza1", "embedded"]

# docs.rs builds on the x86_64 host by default; the bare-metal peripheral code
# only compiles for the device triple, so build the docs there.
[package.metadata.docs.rs]
default-target = "armv7a-none-eabihf"

[lib]
# Unit tests (in #[cfg(all(test, not(target_os="none")))]) run natively via
# `cargo test` (host target). They cannot compile for armv7a-none-eabihf
# because the `test` crate requires std.
test = false

[features]
## The synchronous embedded-sdmmc FAT stack (`fat` module + the BlockDevice/TimeSource adapters in
## `sd`). Off by default: DelugeFirmware replaced it with the async `embedded-fatfs` mount in R4 and
## references none of it, so the whole second filesystem -- and its heapless 0.8 pin -- stays out of
## the dependency graph unless something actually asks for it.
fat = ["dep:embedded-sdmmc"]
default = []
## Drive `audio::init_direct` from a per-block RX DMA interrupt (the audio SDK's
## v2 cadence) instead of the default poll loop. Selected by `deluge/audio-irq`.
audio-irq = []
## Expose the [`flash`] module (SPI-NOR chip profile + board memory map over the
## SoC `rza1l_hal::spibsc` controller). Opt-in because only the app-loader writes
## to flash; gating it keeps it out of every other firmware's build.
flash = []
## Implement `embedded-graphics` `DrawTarget`/`OriginDimensions` for `oled::FrameBuffer`
## so the page-major buffer is a runtime-agnostic draw surface (host + device) without
## the async `deluge-sdk::Oled` wrapper. Used by hosts (e.g. spark) that render their
## own UI into the frame buffer and read it back via `FrameBuffer::as_bytes`.
embedded-graphics = ["dep:embedded-graphics-core"]
## Expose the USB **host** stack (`usb::host`: generic host class drivers +
## UAC/MIDI). Opt-in — only host-role firmwares need it; gating it keeps
## `embassy-usb-host` (and its `ssmarshal` dep) out of every other build.
usb-host = ["dep:embassy-usb-host"]

[dependencies]
rza1l-hal = { path = "../rza1l-hal", version = "0.1.0" }
embedded-sdmmc = { version = "0.9", default-features = false, features = ["log"], optional = true }
critical-section = { workspace = true }
log = { workspace = true }
embedded-graphics-core = { version = "0.4", optional = true }
heapless = "0.9"
# USB **host** stack — gated behind the `usb-host` feature, unlike the
# device-side `embassy-usb` below. The host class drivers in `usb::host` are
# generic over `UsbHostAllocator` and are unit-tested against a mock on
# armv7-unknown-linux-gnueabihf under QEMU (see tools/test.sh), which is
# `target_os = "linux"` — so these cannot be gated to `target_os = "none"`.
embassy-sync = { workspace = true }
embassy-usb-driver = { workspace = true }
embassy-usb-host = { workspace = true, optional = true }

[target.'cfg(target_os = "none")'.dependencies]
cortex-ar = { workspace = true }
embassy-futures = { workspace = true }
embassy-time = { workspace = true, features = ["tick-hz-1_000_000"] }
embassy-usb = { workspace = true }
# For `#[embassy_executor::task]` + `Spawner` in `usb::host`'s supervisor and
# per-device tasks. No executor features needed here — the firmware selects the
# platform/executor backend.
embassy-executor = { workspace = true }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
critical-section = { workspace = true, features = ["std"] }
# `embassy-usb-host` pulls in `embassy-time`, which needs a registered time
# driver to *link* the test binary. `mock-driver` supplies one.
embassy-time = { workspace = true, features = ["mock-driver"] }
embassy-futures = { workspace = true }


