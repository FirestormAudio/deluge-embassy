[package]
name = "wren-firmware"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Deluge on-device Wren scripting firmware (RZ/A1L) via Embassy"

[lib]
# A thin lib target exists solely so the host-only `stream` module (Sa-3b
# slice 4's pure `plan_window` planner + `StreamReg`) is unit-testable via
# `cargo test -p wren-firmware --lib --target x86_64-unknown-linux-gnu`. The
# device build (`.cargo/config.toml`'s default `armv7a-none-eabihf` target)
# never runs this test harness, so it's untouched by `[lib] test = false`
# elsewhere in this workspace (e.g. deluge-alloc, rza1l-hal) — this lib is
# cfg-trivial (empty) on device, since `stream` is `#![cfg(not(target_os =
# "none"))]`. All product behavior stays in the `[[bin]]` below; nothing
# depends on this crate as a library.
name = "wren_firmware"
path = "src/lib.rs"

[[bin]]
name = "wren-firmware"
test = false

[dependencies]
# The Deluge SDK re-exports `deluge_bsp` and `rza1l_hal`, so the firmware depends
# only on `deluge` and reaches the lower layers through it where still needed
# (e.g. the hand-built USB CDC stack).
deluge-sdk = { path = "../crates/deluge-sdk", default-features = false }
wren-sys = { path = "../wren-sys" }
# The portable Wren runtime: bindings + DSP engine + the `Host` trait this
# firmware implements. Shared with the web simulator so the two never drift.
deluge-wren-core = { path = "../crates/deluge-wren-core" }
# The DSP graph engine backing the audio task. Sized to satisfy
# deluge_wren_core's binding contract (NODES >= WREN_MAX_NODES, BUSES >= 8).
deluge-audio-graph = { path = "../crates/deluge-audio-graph" }
# Named directly (not just transitively, via deluge-audio-graph) so the
# host-only stream prefetch (`src/stream.rs`) can reach `deluge_dsp_kernels::
# wav::{parse, decode_i16_le}` to decode a streamed sample's WAV file.
deluge-dsp-kernels = { path = "../crates/deluge-dsp-kernels" }
embassy-time = { workspace = true, features = ["tick-hz-1_000_000"] }
embassy-sync.workspace = true
embassy-futures.workspace = true
log.workspace = true

# ── Device (the Deluge, armv7a-none-eabihf) ──────────────────────────────────
# The Cortex-A executor backend and the USB-CDC REPL transport (`embassy-usb` +
# the `rza1l_hal` device stack) are device-only. Mirrors crates/deluge-sdk's
# per-target embassy-executor split so cargo unifies to one executor build.
[target.'cfg(target_os = "none")'.dependencies]
cortex-ar.workspace = true
embassy-executor = { workspace = true, features = ["nightly", "platform-cortex-ar", "executor-thread"] }
embassy-usb.workspace = true

# ── Host (the desktop simulator, `cargo deluge sim`) ─────────────────────────
# The std executor backend; the REPL runs over stdin/stdout (no USB in the sim).
[target.'cfg(not(target_os = "none"))'.dependencies]
embassy-executor = { workspace = true, features = ["nightly", "platform-std", "executor-thread"] }

[features]
default = []
rtt = ["deluge-sdk/rtt"]
