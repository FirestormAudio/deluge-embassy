[package]
publish = false  # binary crate — not for crates.io
name = "audio_passthru"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Deluge SDK example: a line-in audio effect (gain + soft-clip)."

[[bin]]
name = "audio_passthru"
test = false

[dependencies]
deluge = { path = "../../crates/deluge-sdk", package = "deluge-sdk" }

[features]
default = []
## Desktop simulator backend (`cargo deluge sim`). Declared (not default-on) so
## `#[deluge::app]`'s `cfg(feature = "sim")` branch is a recognised feature
## value here, not an `unexpected_cfgs` warning.
sim = ["deluge/sim"]
## Deluge Linux userland backend (`cargo deluge linux --features linux`).
linux = ["deluge/linux"]
## Opt-in RTT (SEGGER) logging over a debug probe.
rtt = ["deluge/rtt"]
